spring.application.name=luciano

# 默认激活 local profile,加载本地的 application-local.properties(含 API Key,该文件不提交)
spring.profiles.active=local

# LLM 模型配置(API Key 不在此文件,位于未提交的 application-local.properties)
llm.model=qwen-plus
llm.tts-model=cosyvoice-v1
llm.tts-voice=longxiaochun
llm.image-model=wanx2.1-t2i-turbo
llm.vision-model=qwen-vl-max
# 启用联网搜索(qwen 内置,零额外成本)
llm.search-enabled=true

# 心知天气配置(API Key 位于未提交的 application-local.properties)
weather.api-url=https://api.seniverse.com/v3/weather/now.json
weather.default-location=beijing
# 和风天气增强(可选,Key 位于未提交的 local 配置;未配置时自动降级心知)
weather.qweather-key=

# 邮件配置(SMTP 主机/端口公开,发件人和授权码在未提交的 local 配置)
mail.host=smtp.qq.com
mail.port=465

# RAG 知识库增强(极简关键词检索版,可开关做对比测试)
rag.enabled=true

# 自主规划 Agent(长任务:一句目标 → 拆步执行 → 完整成品)
agent.enabled=true
