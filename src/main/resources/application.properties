spring.application.name=demo

# DashScope / 通义千问 配置(真实 key 在 secret.properties,勿提交 git)
dashscope.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
dashscope.chat-model=qwen-plus
dashscope.vision-model=qwen-vl-max
dashscope.image-model=qwen-image-plus
dashscope.image-endpoint=https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
dashscope.task-endpoint=https://dashscope.aliyuncs.com/api/v1/tasks
dashscope.tts-model=cosyvoice-v2
dashscope.tts-voice=longxiaochun_v2
dashscope.tts-endpoint=https://dashscope.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer

# 语音识别模型(OpenAI 兼容 /audio/transcriptions 接口;逗号分隔,按顺序逐个尝试)
dashscope.asr-models=qwen3-asr-flash,qwen-audio-asr

# 和风天气配置(真实 key 在 secret.properties,勿提交 git)
qweather.base-url=https://mj6cdqy77e.re.qweatherapi.com

# 天气查询默认城市(消息里没提到城市时使用)
weather.default-city=南京

# 语音回复最多播报字数:微信语音约 60 秒上限,超出部分自动截断播报并补发完整文字
voice.max-chars=120